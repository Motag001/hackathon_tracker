[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hackagent"
version = "0.1.0"
description = "Single-user, human-in-the-loop multi-agent system for finding and entering online hackathons."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3,<3",
    "httpx2>=2.13",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
# Renderers used by the Builder's document skills. Kept optional so the
# discovery/scoring jobs install fast.
skills = [
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
hackagent = "hackagent.pipelines.cli:main"

[tool.setuptools.packages.find]
include = ["hackagent*"]

[tool.setuptools.package-data]
hackagent = ["skills/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
