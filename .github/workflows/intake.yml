name: Intake (discover, rules, score)

on:
  schedule:
    # Daily at 05:17 UTC (06:17 Lagos). Off the hour to avoid scheduler load.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    # Batch requests can take up to an hour; leave headroom.
    timeout-minutes: 75
    environment: agents
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: hackagent intake
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
