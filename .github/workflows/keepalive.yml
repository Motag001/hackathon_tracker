name: Supabase keep-alive

on:
  schedule:
    # Every 3 days; Supabase free projects pause after a week of inactivity.
    - cron: "41 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: agents
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Ping Supabase
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Agents are not configured yet: add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY to the 'agents' environment secrets (see README). Skipping."
            exit 0
          fi
          hackagent keepalive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
